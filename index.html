<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kemal Gokhan - DevOps Engineer & AI Cloud Architect. Expert in AWS, Kubernetes, and AI/ML Solutions.">
  <title>Kemal Gokhan | DevOps & AI Cloud Architect</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YT73FVJ4RG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YT73FVJ4RG');
  </script>
  
  <!-- Force HTTPS -->
  <script>
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      location.replace('https:' + window.location.href.substring(window.location.protocol.length));
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Redirecting...</p>
  </div>
  
  <script>
    // Language detection and redirect
    (function() {
      // Detect browser language
      const browserLang = navigator.language.split('-')[0];
      
      // Redirect to appropriate language
      const targetLang = browserLang === 'tr' ? 'tr' : 'en';
      
      // Redirect after short delay
      setTimeout(() => {
        window.location.href = `/${targetLang}/`;
      }, 500);
    })();
  </script>
</body>
</html>
